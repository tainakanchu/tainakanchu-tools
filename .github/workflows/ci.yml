name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 台湾マップの正本データ（src/data/taiwan/）の検証。エラーなら
      # ここで落として、どのファイルのどこが壊れているかをログに出す。
      # 配信用 JSON の生成は build（Vite プラグイン）に任せる
      - name: Validate Taiwan map data
        run: pnpm taiwan:validate

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Validate Cloudflare Workers config
        run: pnpm exec wrangler deploy --dry-run
