<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      配色(ライト・ダーク)を最初の描画より前に決める。React が起動してからだと
      ダークの人に一瞬白い画面が見えるため、CSS や本体の JS より先に置く。
      判定は src/lib/theme/theme.ts と同じ(保存値 > OS の設定)。変えるときは両方を直す
    -->
    <script>
      ;(function () {
        var setting = null
        try {
          setting = window.localStorage.getItem('tainakanchu-tools:theme')
        } catch (e) {}
        var dark =
          setting === 'dark' ||
          (setting !== 'light' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.dataset.theme = dark ? 'dark' : 'light'
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <meta name="theme-color" content="#0f172a" />
